[project]
name = "AuroraBot"
version = "0.6.0"
description = "以 AgentTree、同构 Agent 和四角色消息为核心的自主智能体框架。"
readme = "README.md"
requires-python = ">=3.12, <3.15"
dependencies = []

[project.scripts]
aurora = "aurora.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aurora", "aurora.*", "src", "src.*"]

[dependency-groups]
dev = ["donk>=1.1.0", "pyright[nodejs]", "ruff", "pytest", "pytest-cov"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "F",
    "W",
    "E",
    "I",
    "C90",
    "N",
    "PL",
    "UP",
    "ANN",
    "ASYNC",
    "BLE",
    "B",
    "COM",
    "DTZ",
    "T10",
    "PIE",
    "T20",
    "PTH",
    "RET",
    "SIM",
    "TC",
    "RUF",
]
ignore = ["ANN202", "COM812", "PLR0913"]
allowed-confusables = ["，", "。", "“", "”", "：", "；", "？", "！", "（", "）", "、"]

[tool.ruff.lint.per-file-ignores]
"src/engine/runtime.py" = ["BLE001"]

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "standard"
include = ["aurora", "src", "tests"]
exclude = [".venv", "**/node_modules", "**/__pycache__", "**/.*"]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
