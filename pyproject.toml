[project]
name = "AuroraBot"
version = "0.4.0"
description = "AuroraBot 是一个新一代的内驱式、自主决策的智能体框架。"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "litellm>=1.83.14",
    "concurrent-log-handler>=0.9.29",
    "mem0ai[nlp]>=2.0.1",
    "pyyaml>=6.0.3",
    "chromadb>=1.5.9",
    "websockets<14.0",
    "botocore>=1.43.12",
    "tiktoken>=0.13.0",
    "rich>=15.0.0",
    "mcp[cli]>=1.27,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "jsonschema>=4.23,<5",
]

[project.scripts]
aurora = "scripts.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts", "scripts.*"]

[dependency-groups]
dev = [
    "pyright[nodejs]",
    "ruff",
    "pytest",
    "pytest-cov",
    "donk>=1.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
# For more rules, see https://docs.astral.sh/ruff/rules/.
select = [
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "E",     # pycodestyle errors
    "I",     # isort
    "C90",   # mccabe
    "N",     # pep8-naming
    "PL",    # pylint
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "SLOT",  # flake8-slots
    "TID",   # flake8-tidy-imports
    "TC",    # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    # "ERA",   # eradicate
    "FAST",  # FastAPI
    "PERF",  # Perflint
    "PGH",   # pygrep-hooks
    "FURB",  # refurb
    "TRY",   # tryceratops
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E402",    # module-import-not-at-top-of-file  # gateway configures env before importing litellm
    "UP037",   # quoted-annotation
    # "RUF001",  # ambiguous-unicode-character-string
    # "RUF002",  # ambiguous-unicode-character-docstring
    # "RUF003",  # ambiguous-unicode-character-comment
    # "ANN201",  # missing-return-type-undocumented-public-function
    "ANN202",  # missing-return-type-private-function
    "ANN401",  # any-type
    "COM812",  # missing-trailing-comma
    "PLC0415", # import-outside-top-level
]
allowed-confusables = ["，", "。", "“", "”", "：", "；", "？", "！", "【", "】", "《", "》", "…", "—", "（", "）", "、"]

[tool.ruff.lint.per-file-ignores]
"apps/*/__init__.py" = ["N999"]
"src/platform/__init__.py" = ["A005"]
"src/apps/*/__init__.py" = ["N999"]
"src/kernel/events.py" = ["PLR0913", "TRY003"]
"src/kernel/node.py" = ["TC001", "TRY003"]
"src/kernel/records.py" = ["TC001"]
"src/kernel/runtime.py" = ["TC001", "TC003", "TRY003", "TRY004", "TRY301"]
"src/localhost/api.py" = ["TC003"]
"src/localhost/configuration.py" = ["C901", "PLR0912", "PLR0915", "PLR2004", "TC003", "TRY003"]
"src/localhost/runtime.py" = ["TC003"]
"src/nodes/decide.py" = ["TC001"]
"src/platform/local.py" = ["TC001", "TRY003", "TRY004", "TRY301"]
"src/utils/jsonio.py" = ["TC003"]
"src/ai/gateway.py" = ["PLR0913", "TRY003"]
"src/ai/vnext.py" = ["TC001", "TRY003"]
"src/apps/aurora-app-clock/service.py" = ["TC003", "TRY003"]
"src/platform/mcp_platform.py" = ["BLE001", "TC001", "TRY003", "TRY004"]
"src/platform/mcp/client_manager.py" = ["C901"]
"tests/test_api.py" = ["PLR2004", "TC003"]
"tests/test_causal_loop.py" = ["TC003"]
"tests/test_configuration.py" = ["TC003"]
"tests/test_model_gateway.py" = ["TC003"]
"tests/conftest.py" = ["E501"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "standard"
exclude = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
