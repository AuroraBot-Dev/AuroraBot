[project]
name = "AuroraBot"
version = "0.4.1"
description = "拥有主动节律、可持续工作且行动可追溯的自主智能体框架。"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "litellm>=1.83.14",
    "pyyaml>=6.0.3",
    "websockets<14.0",
    "botocore>=1.43.12",
    "tiktoken>=0.13.0",
    "rich>=15.0.0",
    "mcp[cli]>=1.27,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "jsonschema>=4.23,<5",
    "python-multipart>=0.0.9",
    "prompt-toolkit>=3.0,<4",
    "mem0ai>=2.0.17",
    "chromadb>=1.5.9",
    "sqlalchemy>=2.0",
]

[project.scripts]
aurora = "aurora.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aurora", "aurora.*", "ops", "ops.*", "src", "src.*"]

[dependency-groups]
dev = ["pyright[nodejs]", "ruff", "pytest", "pytest-cov", "donk>=1.1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.report]
fail_under = 75

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
# For more rules, see https://docs.astral.sh/ruff/rules/.
select = [
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "E",     # pycodestyle errors
    "I",     # isort
    "C90",   # mccabe
    "N",     # pep8-naming
    "PL",    # pylint
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "SLOT",  # flake8-slots
    "TID",   # flake8-tidy-imports
    "TC",    # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    # "ERA",   # eradicate
    "FAST", # FastAPI
    "PERF", # Perflint
    "PGH",  # pygrep-hooks
    "FURB", # refurb
    "TRY",  # tryceratops
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E402",  # module-import-not-at-top-of-file  # gateway configures env before importing litellm
    "UP037", # quoted-annotation
    # "RUF001",  # ambiguous-unicode-character-string
    # "RUF002",  # ambiguous-unicode-character-docstring
    # "RUF003",  # ambiguous-unicode-character-comment
    # "ANN201",  # missing-return-type-undocumented-public-function
    "ANN202",  # missing-return-type-private-function
    "ANN401",  # any-type
    "COM812",  # missing-trailing-comma
    "PLC0415", # import-outside-top-level
    "N999",    # forbidden-import-alias (allowed in __init__.py)
    "TRY003",  # too-many-nested-blocks
    "PLR0913", # too-many-arguments
]
allowed-confusables = [
    "，",
    "。",
    "“",
    "”",
    "：",
    "；",
    "？",
    "！",
    "【",
    "】",
    "《",
    "》",
    "…",
    "—",
    "（",
    "）",
    "、",
]

[tool.ruff.lint.per-file-ignores]
"src/contracts/model.py" = ["TRY004"]
"src/contracts/configuration*.py" = [
    "C901",
    "PLR0912",
    "PLR0915",
    "PLR2004",
    "TC003",
]
# 面板 API：工厂式 FastAPI 路由惯例；Annotated 依赖在本项目 FastAPI 版本
# 与 `from __future__ import annotations` 组合下失效（RFC 0218 实测），使用经典写法。
"tests/test_panel_api.py" = ["B008", "PLR2004"]
# 文本解析：线性分支解析（类型转换/错误归一），复杂度集中在单函数。
"ops/parser.py" = ["C901", "PLR0911", "PLR0912", "TRY301"]
# 注册表：全局惰性加载标记与装饰器签名占位。
"ops/registry.py" = ["ARG001", "PLW0603"]
"src/config/loader.py" = ["C901", "PLR0912", "PLR0915", "PLR2004", "TC003"]
"src/engine/state.py" = [
    "BLE001",
    "C901",
    "PLR0912",
    "TC001",
    "TC003",
    "TRY004",
    "TRY301",
]
"src/engine/store*.py" = [
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "TC001",
    "TC003",
    "TRY004",
]
"src/platform/__init__.py" = ["A005"]
"src/contracts/agent.py" = ["TC001"]
"src/config/sections.py" = ["C901", "PLR0912", "PLR2004", "TC003"]
"src/engine/runtime.py" = ["BLE001", "TC001"]
"ops/runtime.py" = ["BLE001", "TC003"]
"ops/api.py" = ["C901", "B008", "FAST002", "PLR0915", "PLR0912"]
"src/agents/handler.py" = ["C901", "PLR0911", "PLR0912", "PLR2004", "TC001"]
"src/memory/service.py" = ["BLE001"]
"src/ai/gateway.py" = ["C901", "PLR0912", "TC001"]
"src/apps/aurora-app-clock/service.py" = ["TC003"]
"src/platform/mcp/adapter.py" = ["BLE001", "C901", "PLR0911", "TC001", "TRY004"]
"src/platform/mcp/client_manager.py" = ["C901"]


[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "standard"
include = ["aurora", "ops", "src", "tests"]
exclude = [".venv", "**/node_modules", "**/__pycache__", "**/.*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
