[project]
name = "aurora-meta-build"
version = "0.1.0"
description = "Aurora plugin manifest generation and static inspection"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
aurora-meta = "aurora_meta_build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_meta_build"]
