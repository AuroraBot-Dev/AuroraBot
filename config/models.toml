# 模型配置 — Provider 连接与角色端点映射
# 能力由 models.dev 自动派生，TOML 中可显式 capabilities 来手工覆盖
# 定价以 models.dev 为第一信息源

# Provider 定义：密钥仅存于环境变量，TOML 只声明变量名
[models.providers.deepseek]
adapter = "litellm"
secret_env = "DEEPSEEK_API_KEY"

[models.providers.xiaomi_mimo]
adapter = "litellm"
secret_env = "XIAOMI_MIMO_API_KEY"

[models.providers.openai]
adapter = "litellm"
secret_env = "OPENAI_API_KEY"

[models.providers.siliconflow]
adapter = "openai_compatible"
base_url = "https://api.siliconflow.cn/v1"
secret_env = "SILICONFLOW_API_KEY"


# Role 定义：每个 role 绑定一个 provider 的具体 model + 端点
# fast → chat_completions (低延迟，快速决策)
# quality → responses (高能力，复杂推理)
[models.roles.fast]
provider = "deepseek"
model = "deepseek-v4-flash"
endpoint = "chat_completions"

[models.roles.quality]
provider = "deepseek"
model = "deepseek-v4-pro"
endpoint = "responses"
capabilities = [
    "chat",
    "stream",
    "json_text_fallback",
    "tools",
    "reasoning",
    "structured_output",
]

[models.roles.multimodal]
provider = "xiaomi_mimo"
model = "mimo-v2.5-pro"
endpoint = "chat_completions"

[models.logging]
log_queries = false
log_responses = false
