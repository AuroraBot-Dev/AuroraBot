# 模型配置 — Provider 连接与角色端点映射
# 能力由 models.dev 自动派生，TOML 中可显式 capabilities 来手工覆盖
# 定价以 models.dev 为第一信息源

# Provider 定义：密钥仅存于环境变量，TOML 只声明变量名
[models.providers.deepseek]
adapter = "litellm"
secret_env = "DEEPSEEK_API_KEY"

[models.providers.xiaomi_mimo]
adapter = "litellm"
secret_env = "XIAOMI_MIMO_API_KEY"

[models.providers.openai]
adapter = "litellm"
secret_env = "OPENAI_API_KEY"

[models.providers.siliconflow]
adapter = "openai_compatible"
base_url = "https://api.siliconflow.cn/v1"
secret_env = "SILICONFLOW_API_KEY"


# Role 定义：每个 role 绑定一个 provider 的具体 model
[models.roles.fast]
provider = "deepseek"
model = "deepseek-v4-flash"

[models.roles.quality]
provider = "deepseek"
model = "deepseek-v4-pro"
# 显式声明：quality 是确定性角色，不受 models.dev 冷启动影响
capabilities = [
    "chat",
    "stream",
    "json_text_fallback",
    "tools",
    "structured_output",
    "reasoning",
]

[models.roles.multimodal]
provider = "xiaomi_mimo"
model = "mimo-v2.5-pro"

[models.roles.embedding]
provider = "openai"
model = "text-embedding-3-small"

[models.logging]
log_queries = false
log_responses = false
