# AuroraBot 配置

# 运行时配置
[runtime]
profile = "prod"
workspace = "data/kernel"
debug_host = "127.0.0.1"
debug_port = 8765

# 代理配置
[runtime.agents]
root_profile = "builtin.gate"
worker_profile = "builtin.worker"
memory_agent_profile = "builtin.memory"
max_active_agents = 16
max_agents_per_task = 8
max_depth = 3
max_children_per_agent = 4
turn_concurrency = 8
model_concurrency = 4
tool_concurrency = 8
blocking_workers = 4
lease_seconds = 30.0
ambient_ttl_seconds = 1800.0

# 自主配置
[runtime.autonomy]
scan_seconds = 1.0
heartbeat_initial_seconds = 30.0
heartbeat_min_seconds = 30.0
heartbeat_max_seconds = 1800.0
autonomous_daily_model_calls = 24
autonomous_daily_tokens = 100000

# 交互任务配置
[runtime.interactive_task]
max_model_calls = 8
max_tool_calls = 6
max_duration_seconds = 300.0

# 自主任务配置
[runtime.autonomous_task]
max_model_calls = 3
max_tool_calls = 2
max_duration_seconds = 120.0

# 平台配置

# 面板配置
[dashboard]
host = "127.0.0.1"
port = 8000
database_path = "data/platform/dashboard/chat.sqlite3"
upload_dir = "data/platform/dashboard/uploads"
max_upload_bytes = 67108864
session_ttl_seconds = 604800
allowed_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]

[dashboard.owner]
username = "admin"

[dashboard.bot]
username = "aurorabot"
display_name = "AuroraBot"
avatar_url = ""

[logging]
level = "INFO"

[storage]
data_dir = "data"

[models.roles.fast]
provider = "deepseek"
model = "deepseek-v4-flash"
endpoint = "chat_completions"
capabilities = [
    "chat",
    "stream",
    "structured_output",
    "json_text_fallback",
    "tools",
]

[models.roles.quality]
provider = "deepseek"
model = "deepseek-v4-pro"
endpoint = "chat_completions"
capabilities = [
    "chat",
    "stream",
    "structured_output",
    "json_text_fallback",
    "tools",
    "native_responses",
    "reasoning",
]

[models.roles.agent]
provider = "deepseek"
model = "deepseek-v4-pro"
endpoint = "responses"
capabilities = [
    "chat",
    "stream",
    "structured_output",
    "json_text_fallback",
    "tools",
    "native_responses",
    "reasoning",
]

[models.roles.multimodal]
provider = "xiaomi_mimo"
model = "mimo-v2.5-pro"
endpoint = "chat_completions"
capabilities = [
    "chat",
    "stream",
    "structured_output",
    "json_text_fallback",
    "vision",
]

[models.roles.embedding]
provider = "siliconflow"
model = "BAAI/bge-m3"
endpoint = "chat_completions"
capabilities = ["embedding"]

[models.providers.deepseek]
adapter = "litellm"
secret_env = "DEEPSEEK_API_KEY"

[models.providers.xiaomi_mimo]
adapter = "litellm"
secret_env = "XIAOMI_MIMO_API_KEY"

[models.providers.openai]
adapter = "litellm"
secret_env = "OPENAI_API_KEY"

[models.providers.siliconflow]
adapter = "openai_compatible"
base_url = "https://api.siliconflow.cn/v1"
secret_env = "SILICONFLOW_API_KEY"

[models.logging]
log_queries = false
log_responses = false
