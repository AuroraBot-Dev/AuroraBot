# AuroraBot vNext 的跨环境默认配置。
# 结构性配置只使用 TOML；密钥由本文件引用的环境变量提供。

[runtime]
profile = "dev"
workspace = "data/kernel"
debug_host = "127.0.0.1"
debug_port = 8765

[runtime.scheduler]
enabled = true
scan_seconds = 1.0
idle_initial_seconds = 30.0
idle_max_seconds = 1800.0
idle_multiplier = 2.0
action_cooldown_seconds = 300.0
autonomous_daily_model_calls = 24
autonomous_daily_tokens = 100000

[runtime.interactive_episode]
max_model_calls = 8
max_tool_calls = 6
max_duration_seconds = 300.0

[runtime.autonomous_episode]
max_model_calls = 3
max_tool_calls = 2
max_duration_seconds = 120.0

[soul]
path = "config/prompts/SOUL.md"

[logging]
level = "INFO"

[storage]
data_dir = "data"

[models.roles.fast]
provider = "deepseek"
model = "deepseek-v4-flash"
endpoint = "chat_completions"
capabilities = [
    "chat",
    "stream",
    "structured_output",
    "json_text_fallback",
    "tools",
]

[models.roles.quality]
provider = "deepseek"
model = "deepseek-v4-pro"
endpoint = "chat_completions"
capabilities = [
    "chat",
    "stream",
    "structured_output",
    "json_text_fallback",
    "tools",
    "native_responses",
    "reasoning",
]

[models.roles.agent]
provider = "deepseek"
model = "deepseek-v4-pro"
endpoint = "responses"
capabilities = [
    "chat",
    "stream",
    "structured_output",
    "json_text_fallback",
    "tools",
    "native_responses",
    "reasoning",
]

[models.roles.multimodal]
provider = "xiaomi_mimo"
model = "mimo-v2.5-pro"
endpoint = "chat_completions"
capabilities = [
    "chat",
    "stream",
    "structured_output",
    "json_text_fallback",
    "vision",
]

[models.roles.embedding]
provider = "siliconflow"
model = "BAAI/bge-m3"
endpoint = "chat_completions"
capabilities = ["embedding"]

[models.providers.deepseek]
adapter = "litellm"
secret_env = "DEEPSEEK_API_KEY"

[models.providers.xiaomi_mimo]
adapter = "litellm"
secret_env = "XIAOMI_MIMO_API_KEY"

[models.providers.openai]
adapter = "litellm"
secret_env = "OPENAI_API_KEY"

[models.providers.siliconflow]
adapter = "openai_compatible"
base_url = "https://api.siliconflow.cn/v1"
secret_env = "SILICONFLOW_API_KEY"

[models.logging]
# 仅影响 DEBUG 日志；默认不记录用户消息、提示词或模型回复正文。
log_queries = true
log_responses = true
