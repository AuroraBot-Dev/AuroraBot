# AuroraBot vNext 的跨环境默认配置。
# 结构性配置只使用 TOML；密钥由本文件引用的环境变量提供。

[runtime]
profile = "dev"
workspace = "data/kernel"
debug_host = "127.0.0.1"
debug_port = 8765

[soul]
path = "config/prompts/SOUL.md"

[logging]
level = "INFO"

[storage]
data_dir = "data"

[models.roles.fast]
provider = "deepseek"
model = "deepseek-v4-flash"
capabilities = ["chat", "stream", "structured_output", "json_text_fallback"]

[models.roles.quality]
provider = "deepseek"
model = "deepseek-v4-pro"
capabilities = ["chat", "stream", "structured_output", "json_text_fallback"]

[models.roles.multimodal]
provider = "xiaomi_mimo"
model = "mimo-v2.5-pro"
capabilities = [
    "chat",
    "stream",
    "structured_output",
    "json_text_fallback",
    "vision",
]

[models.roles.embedding]
provider = "siliconflow"
model = "BAAI/bge-m3"
capabilities = ["embedding"]

[models.providers.deepseek]
adapter = "litellm"
secret_env = "DEEPSEEK_API_KEY"

[models.providers.xiaomi_mimo]
adapter = "litellm"
secret_env = "XIAOMI_MIMO_API_KEY"

[models.providers.openai]
adapter = "litellm"
secret_env = "OPENAI_API_KEY"

[models.providers.siliconflow]
adapter = "openai_compatible"
base_url = "https://api.siliconflow.cn/v1"
secret_env = "SILICONFLOW_API_KEY"

[models.logging]
# 仅影响 DEBUG 日志；默认不记录用户消息、提示词或模型回复正文。
log_queries = true
log_responses = true
