# MCP 应用配置 — 外部生态的工具与事件来源。
#
# 每个 [[app]] 定义一个 MCP 服务（内建或远程）。enabled = true 的应用必须
# 在 working_dir 可解析：干净克隆默认启用 org.aurora.qq，若未安装
# extensions/apps/Aurora-QQ，请先把该条目 enabled 改为 false。
#
# - stdio：启动本地子进程，stdout 只承载 MCP JSON-RPC，诊断写 stderr。
# - streamable_http：连接远程 HTTPS 服务；此时不得声明 command/working_dir。
# - env 是环境变量白名单，只透传明确点名的变量；密钥仍来自进程环境。

# 内建 Clock 应用：提供时间查询与定时能力
[[app]]
package = "org.aurora.clock"
enabled = false
transport = "stdio"
working_dir = "src/apps/aurora-app-clock"
command = ["uv", "run", "--no-sync", "python", "mcp_server.py"]
env = []
timeout_seconds = 30

# Windows-MCP：Windows 桌面自动化（截屏、鼠标键盘、窗口控制等）
[[app]]
package = "com.github.windows_mcp"
enabled = false
transport = "stdio"
working_dir = "extensions/apps/Windows-MCP"
command = ["uv", "run", "windows-mcp", "serve"]
env = []
timeout_seconds = 60

# Aurora-QQ：通过 OneBot 11 / NapCat 提供 QQ 消息、联系人和群管理能力
[[app]]
package = "org.aurora.qq"
enabled = true
transport = "stdio"
working_dir = "extensions/apps/Aurora-QQ"
command = ["uv", "run", "--frozen", "aurora-qq-mcp"]
env = ["AURORA_QQ_TOKEN", "AURORA_QQ_CONFIG"]
timeout_seconds = 60
