# 应用与平台适配器声明。
# 安装或发现不代表启用；运行时事件和应用私有载荷仍使用 JSON。

adapter = []

[[app]]
package = "org.aurora.console"
enabled = true
transport = "stdio"
working_dir = "src/apps/aurora-app-console"
command = ["uv", "run", "python", "mcp_server.py"]
timeout_seconds = 30

[[app.tool]]
name = "org.aurora.console.send_message"
result_mode = "terminal"

[[app]]
package = "org.aurora.clock"
enabled = true
transport = "stdio"
working_dir = "src/apps/aurora-app-clock"
command = ["uv", "run", "python", "mcp_server.py"]
timeout_seconds = 30

[[app.tool]]
name = "org.aurora.clock.get_current_time"
result_mode = "resume"

[[app.tool]]
name = "org.aurora.clock.set_alarm"
result_mode = "resume"

[[app.tool]]
name = "org.aurora.clock.set_timer"
result_mode = "resume"

[[app.tool]]
name = "org.aurora.clock.list_alarms"
result_mode = "resume"

[[app.tool]]
name = "org.aurora.clock.cancel_alarm"
result_mode = "resume"
