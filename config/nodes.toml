# 认知节点图与节点参数。
# 内置节点和扩展节点均须显式启用；安装扩展不会自动加入运行时。

[[node]]
id = "builtin.decide"
enabled = false
implementation = "src.nodes.decide:DecideNode"
inputs = ["message.received"]
outputs = ["effect.requested"]
capabilities = [
    "org.aurora.console.send_message",
]
model_roles = []

[[edge]]
event_type = "message.received"
target = "builtin.model_decide"

[[node]]
id = "builtin.model_decide"
enabled = true
implementation = "src.nodes.model_decide:ModelDecideNode"
inputs = ["message.received"]
outputs = ["effect.requested"]
capabilities = [
    "org.aurora.console.send_message",
    "org.aurora.clock.get_current_time",
    "org.aurora.clock.set_alarm",
    "org.aurora.clock.set_timer",
    "org.aurora.clock.list_alarms",
    "org.aurora.clock.cancel_alarm",
]
model_roles = ["fast"]
