# Agent 定义 — profile、能力授权与委派边界
# 每个 [[agent]] 定义一个 Agent 配置项

# Gate：入口 Agent，接收所有交互并决定委派
[[agent]]
id = "builtin.gate"
implementation = "src.agents.tool_agent:ToolAgent"
model_role = "quality"
capabilities = ["*"]
can_delegate = true
child_profiles = ["builtin.worker"]

# Worker：执行具体工作的通用 Agent
[[agent]]
id = "builtin.worker"
implementation = "src.agents.tool_agent:ToolAgent"
model_role = "quality"
capabilities = ["*"]
can_delegate = true
child_profiles = ["builtin.worker"]
