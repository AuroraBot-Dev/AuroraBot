[storage]
data_root = "data"
# 各实现包的私有持久化目录；相对 data_root，路径层级与包层级一致
engine = "engine"
ai = "ai"
memory = "memory"
# ops 面板后端（RFC 0218）私有数据目录（Token、会话与附件索引）
ops = "ops"

[storage.platform]
data_dir = "platform"

[storage.platform.mcp]
data_dir = "mcp"
# MCP 平台运行内建应用的私有数据目录（相对 data_dir）
apps_dir = "apps"
