package: im.polaris.diary
name: 日记
version: 1.1.0
brain_version: ">=5.0.0"
type: mcp-server
app_desc: >-
  这个应用负责日记的持久化存储和检索。写入时接受任意内容文本并按日期保存，
  读取时可以按日期查询或列出所有已记录的日期。

mcp:
  transport: stdio
  entry: mcp_server.py
  command: ["uv", "run", "python", "mcp_server.py"]

commands:
  - name: write_diary
    description: 将内容写入指定日期的日记文件。
    parameters:
      date:
        type: string
        description: 日期, 格式 YYYY-MM-DD
        required: true
      content:
        type: string
        description: 日记内容
        required: true
    returns:
      saved:
        type: boolean
        description: 是否保存成功
      date:
        type: string
        description: 写入的日期

  - name: read_diary
    description: 读取指定日期的日记内容。
    parameters:
      date:
        type: string
        description: 日期, 格式 YYYY-MM-DD
        required: true
    returns:
      found:
        type: boolean
        description: 当天是否有日记
      date:
        type: string
        description: 查询的日期
      content:
        type: string
        description: 日记全文

  - name: list_dates
    description: 列出所有已有日记的日期列表。
    parameters: []
    returns:
      dates:
        type: array
        description: 日期列表
      count:
        type: number
        description: 日记总天数
