# ═══════════════════════════════════════════════════════════
# AuroraBot Sandbox 默认访问控制配置
# ═══════════════════════════════════════════════════════════

whitelist:
  files:
    - "PROJECT_DIR/data/sandbox/**"              # sandbox 自有目录完全可读
  dirs:
    - "PROJECT_DIR/data/sandbox/**"
  modules:
    - "json"
    - "math"
    - "re"
    - "datetime"
    - "time"
    - "collections"
    - "itertools"
    - "functools"
    - "string"
    - "textwrap"
    - "hashlib"
    - "hmac"
    - "base64"
    - "random"
    - "uuid"
    - "pathlib"
    - "typing"
    - "dataclasses"
    - "enum"
    - "copy"
    - "pprint"
  builtins:
    - "len"
    - "range"
    - "enumerate"
    - "zip"
    - "map"
    - "filter"
    - "sorted"
    - "reversed"
    - "min"
    - "max"
    - "sum"
    - "abs"
    - "round"
    - "int"
    - "float"
    - "str"
    - "bool"
    - "list"
    - "dict"
    - "set"
    - "tuple"
    - "type"
    - "isinstance"
    - "hasattr"
    - "repr"
    - "id"
    - "hash"
    - "callable"
    - "iter"
    - "next"
    - "print"
    - "format"
    - "chr"
    - "ord"
    - "hex"
    - "oct"
    - "bin"
    - "divmod"
    - "pow"
    - "any"
    - "all"
    - "vars"
    - "dir"
    - "input"

blacklist:
  files: []                           # 默认不额外禁止文件（由 AST 检测 delete 操作）
  dirs: []
  modules:
    # ── 网络访问模块（全部禁止）──
    - "socket"
    - "http"
    - "urllib"
    - "requests"
    - "aiohttp"
    - "httpx"
    - "websocket"
    - "ssl"
    - "ftplib"
    - "smtplib"
    - "xmlrpc"
    - "xmlrpc.client"
    - "xmlrpc.server"
    - "asyncio.open_connection"
    - "asyncio.start_server"
    # ── 包管理器模块（禁止安装/卸载包）──
    - "pip"
    - "pip._internal"
    - "pip._vendor"
    - "setuptools"
    - "pkg_resources"
    - "distutils"
    - "ensurepip"
    - "uv"                          # uv 包管理器
    - "uv._internal"
    - "conda"                       # Conda 包管理器
    - "conda._internal"
    - "poetry"                      # Poetry 依赖管理
    - "pdm"                         # PDM 包管理器
    - "pipenv"                      # Pipenv 虚拟环境管理
    - "virtualenv"                  # virtualenv 环境创建
    - "venv"                        # venv 标准库模块
    # ── 进程/系统操作模块 ──
    - "os"
    - "sys"
    - "subprocess"
    - "shutil"
    - "ctypes"
    - "importlib"
    - "importlib.metadata"
    - "importlib.resources"
    - "importlib.util"
    - "runpy"
    - "code"
    - "codeop"
    - "compileall"
    - "py_compile"
    # ── 危险模块 ──
    - "builtins"                      # 直接访问 builtins.exec/eval/__import__
    - "gc"                            # gc.get_objects() 遍历所有对象
    - "inspect"                       # 帧/栈/代码对象内省
    - "linecache"                     # 按文件名读取源码
    - "traceback"                     # 栈追踪信息泄露
    - "_thread"                       # 低层线程，绕过 threading 黑名单
    # ── Windows 平台危险模块 ──
    - "winreg"                        # Windows 注册表读写
    - "msvcrt"                        # 低层 C 运行时（kbhit/locking）
    - "_winapi"                       # 直接 Win32 API（CreateFile/WriteFile）
    # ── 低层 C 扩展模块 ──
    - "_socket"                       # 低层 socket，绕过 socket 黑名单
    - "_ssl"                          # 低层 SSL，绕过 ssl 黑名单
    - "_ctypes"                       # 低层 FFI，绕过 ctypes 黑名单
    # ── Unicode 归一化绕过 ──
    - "unicodedata"                   # NFKC 归一化可用于绕过字符串检查
    - "signal"
    - "threading"
    - "multiprocessing"
    - "concurrent"
    - "pickle"
    - "shelve"
    - "marshal"
    - "sqlite3"
    - "dbm"
    - "zipfile"
    - "tarfile"
    - "gzip"
    - "bz2"
    - "lzma"
    - "zlib"
    - "operator"                      # 提供 attrgetter/itemgetter，可绕过静态属性检查
    - "types"                          # types.FunctionType 可构造任意函数
  builtins:
    - "exec"
    - "eval"
    - "compile"
    - "__import__"
    - "globals"
    - "locals"
    - "breakpoint"
    - "exit"
    - "quit"
    - "getattr"                       # getattr 由 _check_calls 特殊处理（AST 层）+ builtins 黑名单（运行时层）双重封堵
    - "open"                         # open 由 AccessPolicy 单独控制
