# kernel-α 认知拓扑电路 — 邻接表配置
#
# 节点 A 的 emit 匹配节点 B 的 watch → 存在有向边 A → B
#
# 字段：
#   id       — 全局唯一标识
#   type     — NODE_REGISTRY 中的类型名
#   enabled  — 是否启用（默认 true）
#   watch    — 监听的文件 glob 列表（可选）
#   emit     — 产出的文件路径列表（可选）
#   config   — 节点类特定参数（可选）

nodes:
  # ═══════════════════════════════════════════════════
  # Kernel-γ 认知管线：两池 + 两转义者
  # Event → Preprocess → Internalizer → Externalizer → Dispatch
  # ═══════════════════════════════════════════════════

  # Pool B: 事件收束 & 消息防抖
  - id: message_preprocessor
    type: message_preprocessor
    watch:
      - "inbox/pending/event_*.json"
    emit:
      - "pipeline/message_queue/*.json"

  # 转义者 B→A: 结构化事件 → 第一人称体验
  - id: internalizer
    type: internalizer
    watch:
      - "pipeline/message_queue/*.json"
    emit:
      - "pipeline/internalized/*.json"

  # 转义者 A→B: 第一人称决定 → JSON 动作
  - id: externalizer
    type: externalizer
    watch:
      - "pipeline/internalized/*.json"
    emit:
      - "pipeline/action_queue/*.json"

  # Pool B: 命令派发
  - id: command_dispatcher
    type: command_dispatcher
    watch:
      - "pipeline/action_queue/*.json"

  # ═══════════════════════════════════════════════════
  # Kernel-β 旧节点（disabled——门控和规划已吸收到 Pool A）
  # ═══════════════════════════════════════════════════
  - id: impulse_gate
    type: impulse_gate
    enabled: false
    watch:
      - "pipeline/message_queue/*.json"

  - id: action_planner
    type: action_planner
    enabled: false
    watch:
      - "pipeline/gate_pass/*.json"

  # 旧单体节点（保留为禁用兼容模式）
  - id: polaris
    type: polaris
    enabled: false
    watch:
      - "inbox/pending/event_*.json"
