# kernel-α 认知拓扑电路 — 邻接表配置
#
# 节点 A 的 emit 匹配节点 B 的 watch → 存在有向边 A → B
#
# 字段：
#   id       — 全局唯一标识
#   type     — NODE_REGISTRY 中的类型名
#   enabled  — 是否启用（默认 true）
#   watch    — 监听的文件 glob 列表（可选）
#   emit     — 产出的文件路径列表（可选）
#   config   — 节点类特定参数（可选）

nodes:
  # ═══════════════════════════════════════════════════
  # Kernel-γ 认知管线：两池 + 两转义者
  # Event → Preprocess → Internalizer → Externalizer → Dispatch
  # ═══════════════════════════════════════════════════

  # Pool B: 事件收束 & 消息防抖
  - id: message_preprocessor
    type: message_preprocessor
    watch:
      - "inbox/pending/event_*.json"
    emit:
      - "pipeline/message_queue/*.json"

  # 转义者 B→A: 结构化事件 → 第一人称体验
  - id: internalizer
    type: internalizer
    watch:
      - "pipeline/message_queue/*.json"
    emit:
      - "pipeline/internalized/*.json"

  # 转义者 A→B: 第一人称决定 → JSON 动作
  - id: externalizer
    type: externalizer
    watch:
      - "pipeline/internalized/*.json"
    emit:
      - "pipeline/action_queue/*.json"

  # Pool B: 命令派发
  - id: command_dispatcher
    type: command_dispatcher
    watch:
      - "pipeline/action_queue/*.json"

  # ═══════════════════════════════════════════════════
  # 节律环路：心跳 → 调度 → 节律事件（全部通过相同的文件机制）
  # ═══════════════════════════════════════════════════

  # 周期性心跳（自持振荡，60s 间隔）
  - id: heartbeat
    type: heartbeat_generator
    watch:
      - "heartbeat/tick.json"
    emit:
      - "heartbeat/tick.json"
    config:
      interval_sec: 60

  # 心跳 → 节律触发器
  - id: timer_scheduler
    type: timer_scheduler
    watch:
      - "heartbeat/tick.json"
    emit:
      - "rhythm/triggers/*.json"
    config:
      rules:
        - name: hourly
          minute: 0
          emit: "rhythm/triggers/hourly.json"
        - name: morning
          minute: 0
          hour: 8
          emit: "rhythm/triggers/morning.json"
        - name: evening
          minute: 0
          hour: 22
          emit: "rhythm/triggers/evening.json"
        - name: midnight
          minute: 0
          hour: 2
          emit: "rhythm/triggers/midnight.json"

  # 记忆沉淀：evening/midnight 触发 → 整理记忆 → 归档 now.md
  - id: memory_consolidator
    type: memory_consolidator
    watch:
      - "rhythm/triggers/*.json"
    enabled: false

  # 可观测性：每次心跳统计文件流转
  - id: metrics_collector
    type: metrics_collector
    watch:
      - "heartbeat/tick.json"
    emit:
      - "metrics/status.json"
    enabled: false

  # ═══════════════════════════════════════════════════
  # 拓扑原语（disabled——按需启用）
  # ═══════════════════════════════════════════════════

  - id: dead_letter
    type: dead_letter_router
    enabled: false
    config:
      ttl_sec: 3600
      scan_interval: 600

  # ═══════════════════════════════════════════════════
  # Kernel-β 旧节点（disabled——门控和规划已吸收到 Pool A）
  # ═══════════════════════════════════════════════════
  - id: impulse_gate
    type: impulse_gate
    enabled: false
    watch:
      - "pipeline/message_queue/*.json"

  - id: action_planner
    type: action_planner
    enabled: false
    watch:
      - "pipeline/gate_pass/*.json"

  # 旧单体节点（保留为禁用兼容模式）
  - id: polaris
    type: polaris
    enabled: false
    watch:
      - "inbox/pending/event_*.json"
