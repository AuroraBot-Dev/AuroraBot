# 认知拓扑电路 — 邻接表配置
#
# 每个条目是一个节点实例。边由 watch/emit 的文件模式隐式形成：
#   节点 A 的 emit 匹配节点 B 的 watch → 存在有向边 A → B
#
# 字段：
#   id       — 全局唯一标识（同时也是 node.id）
#   type     — NODE_REGISTRY 中的类型名
#   enabled  — 是否启用（可选，默认 true）
#   watch    — 监听的文件 glob 列表（可选，覆盖节点类默认值）
#   emit     — 产出的文件路径列表（可选，覆盖节点类默认值）
#   config   — 节点类特定参数（可选）
#
# 相邻节点间靠文件模式匹配自动连边，无需显式声明上下游。
#
# 生命周期约定：
#   pending/ — 待处理（文件在此即表示 pending 状态）
#   done/    — 已处理（文件在此即表示 done 状态，由 TerminalRouter 清理）

nodes:
  # ── 脉冲源（暂关） ──────────────────────────────
  - id: heartbeat
    type: heartbeat
    enabled: false
    config:
      interval_sec: 300

  # ── 入口扇出：inbox/pending → reflex/pending + memory/pending ──
  - id: fanout
    type: fanout
    watch:
      - "inbox/pending/event_*.json"
    emit:
      - "reflex/pending"
      - "memory/pending"

  # ── 自发目标生成（暂关） ────────────────────────
  - id: goal-generator
    type: goal_generator
    enabled: false
    watch:
      - "heartbeat/tick.json"
    emit:
      - "intent/pending/goal.json"
    config:
      cooldown_ticks: 6

  # ── 反射链路（短路径——直接响应） ──────────────
  - id: reflex
    type: reflex
    watch:
      - "reflex/pending/event_*.json"
    emit:
      - "actions/pending/action.json"
    config:
      min_confidence: 0.7

  - id: reflex-learner
    type: reflex_learner
    enabled: false
    watch:
      - "plans/done/plan_*.json"
      - "results/done/result_*.json"
    config:
      cooldown_ticks: 12

  # ── 全链路：规划 → 展开 → 执行 ──────────────────
  - id: planner
    type: planner
    watch:
      - "inbox/done/event_*.json"
    emit:
      - "plans/pending/plan.json"

  - id: expander
    type: expander
    watch:
      - "plans/pending/plan_*.json"
    emit:
      - "actions/pending/action.json"

  - id: executor
    type: executor
    watch:
      - "actions/pending/action_*.json"
    emit:
      - "results/pending/result.json"

  # ── 优先切换 / 汇合（暂关） ─────────────────────
  - id: priority-switch
    type: switch
    enabled: false
    watch:
      - "plans/pending/plan_*.json"
    config:
      guard_pattern: "plans/pending/plan_*.json"
      condition_field: "priority"
      condition_op: ">"
      condition_value: 70
      true_trigger: "router/switch/urgent.trigger"
      false_trigger: "router/switch/normal.trigger"

  - id: merge
    type: merge
    enabled: false
    watch:
      - "actions/pending/action_*.json"
    config:
      input_patterns:
        - "actions/pending/action_*.json"
      output_path: "router/merge/merged.json"
      merge_strategy: "concat_array"

  # ── 记忆（记录原始事件） ──────────────────────────
  - id: memory
    type: memory
    watch:
      - "memory/pending/event_*.json"
    emit:
      - "memory/facts.json"
      - "memory/tick.json"

  # ── 生命周期终止（暂关） ────────────────────────
  - id: terminal
    type: terminal
    enabled: false
    watch:
      - "*/done/*.json"
      - "terminal/tick.json"
    emit:
      - "terminal/tick.json"
    config:
      ttl_sec: 60
