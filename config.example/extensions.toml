# 内建扩展声明 — 当前只读注册，尚未进入 AgentTree 组合。
#
# 每条 [[extension]] 声明一个官方内建扩展：
# - id：扩展唯一标识。
# - version：扩展清单版本。
# - enabled：项目期望该扩展参与未来装配。
# - factory：组合根内置工厂标识；不允许指向任意第三方模块字符串。
# - faces：扩展启用的七端口贡献集合。
# - capabilities：扩展向工具目录公开的能力 ID；实现 schema 由代码固定。
#
# 当前加载器保留原始文档，不执行 manifest 校验或扩展装配。

# 认知控制：delegate / wait 两个 ControlAction 贡献
[[extension]]
id = "aurora.builtin.control"
version = "1.0"
enabled = true
factory = "aurora.builtin.control"
faces = ["control_action"]
capabilities = []

# 记忆：主动写入（ControlAction + EffectTool）、被动快照（ContextContributor）
# 与终态投影（Projector）
[[extension]]
id = "aurora.builtin.memory"
version = "1.0"
enabled = true
factory = "aurora.builtin.memory"
faces = ["control_action", "context_contributor", "effect_tool", "projector"]
capabilities = ["aur.serv.memory.remember"]
