# 模型配置 — Provider 连接与角色端点映射。
#
# 当前配置系统只读注册 Provider 与角色端点；Model 实例仍由 assemble_runtime
# 的调用者注入，密钥不会从本文件读取。

# Provider 定义：密钥仅存于环境变量，TOML 只声明变量名
[models.providers.deepseek]
adapter = "litellm"
secret_env = "DEEPSEEK_API_KEY"

[models.providers.xiaomi_mimo]
adapter = "litellm"
secret_env = "XIAOMI_MIMO_API_KEY"

[models.providers.openai]
adapter = "litellm"
secret_env = "OPENAI_API_KEY"

[models.providers.siliconflow]
adapter = "openai_compatible"
base_url = "https://api.siliconflow.cn/v1"
secret_env = "SILICONFLOW_API_KEY"


# Role 定义：每个 role 绑定一个 provider 的具体 model
# capabilities 显式覆盖 models.dev 派生；DeepSeek 拒绝 json_schema response_format，故不含 structured_output
[models.roles.fast]
provider = "deepseek"
model = "deepseek-v4-flash"
capabilities = ["chat", "stream", "json_text_fallback"]

[models.roles.quality]
provider = "deepseek"
model = "deepseek-v4-pro"
capabilities = ["chat", "stream", "json_text_fallback"]

[models.roles.multimodal]
provider = "xiaomi_mimo"
model = "mimo-v2.5-pro"

[models.roles.embedding]
provider = "siliconflow"
model = "BAAI/bge-m3"

[models.logging]
log_queries = false
log_responses = false
