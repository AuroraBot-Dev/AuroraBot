# 模型配置 — Provider 连接与模型端点映射。
#
# start 从本文件构造 Model；测试和嵌入调用仍可显式注入 Model。
# 密钥不会从本文件读取。

# Provider 定义：密钥仅存于环境变量，TOML 只声明变量名
[models.providers.deepseek]
adapter = "litellm"
secret_env = "DEEPSEEK_API_KEY"

[models.providers.xiaomi_mimo]
adapter = "litellm"
secret_env = "XIAOMI_MIMO_API_KEY"

[models.providers.openai]
adapter = "litellm"
secret_env = "OPENAI_API_KEY"

[models.providers.siliconflow]
adapter = "openai_compatible"
base_url = "https://api.siliconflow.cn/v1"
secret_env = "SILICONFLOW_API_KEY"


# Endpoint 定义：每个端点绑定一个 provider 的具体 model
# capabilities 显式覆盖 models.dev 派生；DeepSeek 拒绝 json_schema response_format，故不含 structured_output
[models.endpoints.default]
provider = "deepseek"
model = "deepseek-chat"
capabilities = ["chat", "stream", "json_text_fallback"]

[models.endpoints.fast]
provider = "deepseek"
model = "deepseek-v4-flash"
capabilities = ["chat", "stream", "json_text_fallback"]

[models.endpoints.quality]
provider = "deepseek"
model = "deepseek-v4-pro"
capabilities = ["chat", "stream", "json_text_fallback"]

[models.endpoints.multimodal]
provider = "xiaomi_mimo"
model = "mimo-v2.5-pro"

[models.endpoints.embedding]
provider = "siliconflow"
model = "BAAI/bge-m3"

[models.logging]
log_queries = false
log_responses = false

# 模型调用边界：关闭 Provider SDK 隐式重试，由 Aurora 在总截止时间内控制有限尝试
# 单次尝试最长 90 秒、最多 2 轮；max_output_tokens 是传给 Provider 的生成输出预算
[models.runtime]
attempt_timeout_seconds = 90
max_attempts = 2
total_timeout_seconds = 180
max_output_tokens = 51200
