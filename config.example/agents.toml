[[agent]]
id = "aurora:agent/triage"
description = "注意力初筛：判断眼前世界事件是否值得处理，值得时委派给 root 或 fast-worker。"
prompt = "aurora:prompt/agent/triage"
model = "fast"
tools = ["aurora:tool/delegate"]
children = ["aurora:agent/root", "aurora:agent/fast-worker"]

[[agent]]
id = "aurora:agent/fast-worker"
description = "快速执行者：可发送与读取 QQ 消息，直接完成低风险快速任务，不展开代理树。"
prompt = "aurora:prompt/agent/fast"
model = "fast"
tools = ["#aurora:tool/qq-send", "#aurora:tool/qq-read"]
children = []

[[agent]]
id = "aurora:agent/root"
description = "总代理：理解完整任务、整合结果。"
prompt = "aurora:prompt/agent/root"
model = "quality"
tools = [
    "aurora:tool/delegate",
    "aurora:tool/world_read",
    "aurora:tool/world_scopes",
    "aurora:tool/world_trees",
    "aurora:tool/bot_state",
    "aurora:tool/goal_set",
    "aurora:tool/wake_schedule",
    "aurora:tool/wake_cancel",
    "aurora:tool/memory_recall",
    "aurora:tool/memory_source",
    "aurora:tool/artifact_stat",
    "aurora:tool/artifact_read",
    "aurora:tool/memory_exposures",
    "aurora:tool/memory_feedback",
]
children = [
    "aurora:agent/fast-worker",
    "aurora:agent/chat",
    "aurora:agent/worker",
    "aurora:agent/reviewer",
    "aurora:agent/memory",
]

[[agent]]
id = "aurora:agent/chat"
description = "即时会话回复：生成回复正文，或用发送工具像人类一样分多条投递回原会话。"
prompt = "aurora:prompt/agent/chat"
model = "fast"
tools = ["#aurora:tool/qq-send"]
children = []

[[agent]]
id = "aurora:agent/worker"
description = "通用执行者：掌握全部 QQ、Windows 桌面自动化工具与世界读取，深入完成边界明确的独立工作，可继续委派轻量任务或审阅。"
prompt = "aurora:prompt/agent/worker"
model = "quality"
tools = [
    "aurora:tool/delegate",
    "aurora:tool/world_read",
    "aurora:tool/world_scopes",
    "aurora:tool/world_trees",
    "aurora:tool/bot_state",
    "aurora:tool/goal_set",
    "aurora:tool/wake_schedule",
    "aurora:tool/wake_cancel",
    "aurora:tool/memory_recall",
    "aurora:tool/memory_source",
    "aurora:tool/artifact_stat",
    "aurora:tool/artifact_read",
    "aurora:tool/memory_exposures",
    "aurora:tool/memory_feedback",
    "org.aurora.qq:tool/*",
    "com.github.windows_mcp:tool/*",
]
children = ["aurora:agent/reviewer", "aurora:agent/fast-worker"]

[[agent]]
id = "aurora:agent/reviewer"
description = "独立审阅者：检查给定结果的事实、遗漏和边界，返回简洁可执行的结论。"
prompt = "aurora:prompt/agent/reviewer"
model = "quality"
tools = []
children = []

[[agent]]
id = "aurora:agent/memory"
description = "记忆专员：围绕目标召回经历、核对原始来源，并按后续证据记录可更正的记忆反馈。"
prompt = "aurora:prompt/agent/memory"
model = "quality"
tools = [
    "aurora:tool/memory_recall",
    "aurora:tool/memory_source",
    "aurora:tool/artifact_stat",
    "aurora:tool/artifact_read",
    "aurora:tool/memory_exposures",
    "aurora:tool/memory_feedback",
    "aurora:tool/bot_state",
]
children = []
