# Agent 定义 — profile、能力授权与委派边界。
#
# 本文件定义同构 Agent 的 profile，而不是新的运行时类型。修改能力策略只会
# 改变“谁可以看到并调用什么能力”，不会改变 handler 实现边界。
#
# capabilities 支持：
# - 精确能力 ID（如 "aur.serv.memory.remember"）
# - 前缀通配（"package.*"）
# - 全通配（"*"）
# - `!` 排除；排除始终优先于允许规则。
#
# 能力还必须存在于运行时能力目录（extensions.toml / MCP 工具发现）才会生效；
# 这里只是 profile 的授权域。
#
# Panel 接管配置编辑前，请勿删除 profile 或更改 id 引用，否则 engine.toml
# 的 root_profile/worker_profile 与 child_profiles 交叉校验会启动失败。

# Triage：注意力初筛入口 agent，无工具、快模型，process 时在快脑与主脑之间选择
[[agent]]
id = "builtin.triage"
implementation = "src.agents.triage:TriageAgent"
model_role = "fast"
capabilities = []
can_delegate = true
child_profiles = ["builtin.fast", "builtin.root"]
triage_control = true

# Fast：低延迟快脑，直接响应或调用工具，不继续扩张代理树
[[agent]]
id = "builtin.fast"
implementation = "src.agents.handler:ToolAgent"
model_role = "fast"
capabilities = ["*", "!aur.serv.memory.remember"]
can_delegate = false
child_profiles = []

# Root：本体意识，接收 Triage 委派并决定是否继续委派
[[agent]]
id = "builtin.root"
implementation = "src.agents.handler:ToolAgent"
model_role = "quality"
capabilities = ["*", "!aur.serv.memory.remember"]
can_delegate = true
child_profiles = ["builtin.worker", "builtin.memory"]

# Worker：执行具体工作的通用 Agent
[[agent]]
id = "builtin.worker"
implementation = "src.agents.handler:ToolAgent"
model_role = "quality"
capabilities = ["*", "!aur.serv.memory.remember"]
can_delegate = true
child_profiles = ["builtin.worker"]

# Memory：主动记忆写入的专精 Agent
[[agent]]
id = "builtin.memory"
implementation = "src.agents.handler:ToolAgent"
model_role = "quality"
capabilities = ["aur.serv.memory.remember"]
can_delegate = false
child_profiles = []
