# Agent 定义 — 可复用、无运行状态的节点原型。
#
# 每个 definition 选择一个 Agent prompt、model endpoint、可见 tools 和允许的 child definitions。
# 同一个 prompt 可以被多个 definition 复用；运行时 transcript、parent 和状态只存在于 AgentTree 的 AgentNode 中。

[[agent]]
id = "builtin.root"
description = "总代理：理解完整任务、整合结果，并把独立工作委派给合适的专门 Agent。"
prompt = "builtin.root"
model = "quality"
tools = ["aur.agent.delegate", "aur.serv.world.read", "aur.serv.world.trees"]
children = ["builtin.worker", "builtin.fast-worker", "builtin.reviewer"]

[[agent]]
id = "builtin.chat"
description = "即时会话回复：只生成将由运行时投递回原会话的简短回复正文。"
prompt = "builtin.chat"
model = "fast"
tools = []
children = []

[[agent]]
id = "builtin.triage"
description = "注意力初筛：判断最近世界事件是否值得处理，并选择进入根代理或快速通道。"
prompt = "builtin.triage"
model = "quality"
tools = ["aur.agent.delegate"]
children = ["builtin.root", "builtin.worker", "builtin.fast-worker"]

[[agent]]
id = "builtin.memory"
description = "记忆专员：把托付的内容忠实写入长期记忆，不添加解读。"
prompt = "builtin.memory"
model = "quality"
tools = []
children = []

[[agent]]
id = "builtin.worker"
description = "通用执行者：深入完成一件边界明确的工作，并可请求独立审阅。"
prompt = "builtin.worker"
model = "quality"
tools = ["aur.agent.delegate"]
children = ["builtin.reviewer"]

[[agent]]
id = "builtin.fast-worker"
description = "快速执行者：使用较快模型直接处理事实清楚、风险低的独立工作。"
prompt = "builtin.worker"
model = "fast"
tools = []
children = []

[[agent]]
id = "builtin.reviewer"
description = "独立审阅者：检查给定结果的事实、遗漏和边界，不继续扩张 AgentTree。"
prompt = "builtin.reviewer"
model = "quality"
tools = []
children = []
