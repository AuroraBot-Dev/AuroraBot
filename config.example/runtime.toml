# 运行时配置 — 进程级别参数。
#
# 当前 AgentTree 组合只读取 runtime.tree；其余小节与 profiles 作为进程能力的
# 结构配置只读注册，尚不影响运行。

[runtime.tree]
# 当前 AgentTree 的 root 节点入口
node_id = "root"
profile = "builtin.root"
model = "default"
tools = ["delegate"]

[runtime]
# 激活的 profile（prod / dev），控制 profile 文件的选择
profile = "prod"

[runtime.panel]
# 预留面板后端开关
enabled = true
# HTTP 绑定地址，必须为 loopback
host = "127.0.0.1"
# HTTP 端口，1–65535
port = 8765
# 允许的跨域来源（前端开发服务器，8764/8766 为面板前端左右护法）
allowed_origins = [
    "http://localhost:8764",
    "http://127.0.0.1:8764",
    "http://localhost:8766",
    "http://127.0.0.1:8766",
]
# 启动后是否自动打开浏览器
open_browser = false
# 会话超时（秒）
session_ttl_seconds = 604800
# 附件上传最大字节数，0 表示禁用附件
max_upload_bytes = 67108864

[runtime.console]
# 预留本地交互 Console 开关
enabled = true
# 预留终端日志开关
terminal_logs = false
