[[app]]
package = "org.aurora.clock"
enabled = false
transport = "stdio"
working_dir = "src/apps/aurora-app-clock"
command = ["uv", "run", "--no-sync", "python", "mcp_server.py"]
env = []
timeout_seconds = 30
event_mode = "disabled"

[[app]]
package = "com.github.windows_mcp"
enabled = false
transport = "stdio"
working_dir = "extensions/apps/Windows-MCP"
command = ["uv", "run", "windows-mcp", "serve"]
env = ["ANONYMIZED_TELEMETRY"]
timeout_seconds = 60
event_mode = "disabled"

[[app]]
package = "org.aurora.qq"
enabled = false
transport = "stdio"
working_dir = "extensions/apps/Aurora-QQ"
command = ["uv", "run", "--frozen", "aurora-qq-mcp"]
env = ["AURORA_QQ_TOKEN", "AURORA_QQ_CONFIG"]
timeout_seconds = 60
event_mode = "world_events"
