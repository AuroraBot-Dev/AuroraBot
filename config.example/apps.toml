# MCP 应用配置 — 外部生态的工具与事件来源。
#
# 每个 [[app]] 定义一个 MCP 服务（内建或远程）。启动时会连接所有生效 App，
# 完整发现并冻结工具目录；enabled 表达项目偏好，仍受 platform.mcp.enabled 总开关约束。
#
# - stdio：启动本地子进程，stdout 只承载 MCP JSON-RPC，诊断写 stderr。
# - streamable_http：连接远程 HTTPS 服务；此时不得声明 command/working_dir/env，认证变量名使用 auth_env，
#   当前也不得启用 world_events。
# - env 是 stdio 子进程的环境变量白名单，只透传明确点名的变量；密钥仍来自进程环境。
# - event_mode：disabled、world_events 或 legacy_aurora_event；默认模板不接收 App 主动事件。

# 内建 Clock 应用：提供时间查询与定时能力
[[app]]
package = "org.aurora.clock"
enabled = false
transport = "stdio"
working_dir = "src/apps/aurora-app-clock"
command = ["uv", "run", "--no-sync", "python", "mcp_server.py"]
env = []
timeout_seconds = 30
event_mode = "disabled"

# Windows-MCP：Windows 桌面自动化（截屏、鼠标键盘、窗口控制等）
# 其 PostHog 匿名遥测默认开启，使用 ANONYMIZED_TELEMETRY=false 关闭；变量需在启动 aurora 的进程环境中预先设置。
[[app]]
package = "com.github.windows_mcp"
enabled = false
transport = "stdio"
working_dir = "extensions/apps/Windows-MCP"
command = ["uv", "run", "windows-mcp", "serve"]
env = ["ANONYMIZED_TELEMETRY"]
timeout_seconds = 60
event_mode = "disabled"

# Aurora-QQ：通过 OneBot 11 / NapCat 提供 QQ 消息、联系人和群管理能力
[[app]]
package = "org.aurora.qq"
enabled = false
transport = "stdio"
working_dir = "extensions/apps/Aurora-QQ"
command = ["uv", "run", "--frozen", "aurora-qq-mcp"]
env = ["AURORA_QQ_TOKEN", "AURORA_QQ_CONFIG"]
timeout_seconds = 60
event_mode = "world_events"
