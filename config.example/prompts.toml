# 提示词装配 — 片段路径映射。
#
# 路径相对 config/ 解析。提示词只负责人格与表达，不是授权边界。当前加载器
# 校验文件存在且非空，组合阶段校验每个 Agent definition 使用的 profile 已定义。

# 当前 PromptAssembler 的显式字符上界
max_characters = 32000

# 系统层：对所有 Agent 可见的公共文本
[system]
# 核心人格与行为准则
soul = "prompts/SOUL.md"
# 项目、团队与环境上下文
world = "prompts/WORLD.md"

# Agent 层：按 profile id 映射到专用提示词片段
[agent]
"builtin.triage" = "prompts/agents/triage.md"
"builtin.fast" = "prompts/agents/fast.md"
"builtin.root" = "prompts/agents/root.md"
"builtin.worker" = "prompts/agents/worker.md"
"builtin.reviewer" = "prompts/agents/reviewer.md"
"builtin.memory" = "prompts/agents/memory.md"
