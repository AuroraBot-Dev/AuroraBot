name: 新功能 | Feature Request
description: 为 AuroraBot 提出新功能或改进建议。| Suggest a new feature or enhancement for AuroraBot.
title: "[Feature] "
labels: enhancement
body:
  - type: markdown
    attributes:
      value: |
        请确认 Issues 列表中无重复的项目。
        Please make sure that no duplicate issues have already been submitted.
  - type: textarea
    id: summary
    attributes:
      label: 概述 | Summary
      description: |
        请先介绍你希望改善的使用体验，而不是只描述内部实现。
        Start with the user experience you want to improve, rather than only an internal implementation.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 动机 | Motivation
      description: |
        请描述该功能解决什么问题，或带来什么价值。
        Please describe what problem this feature solves or what value it brings.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 详情 | Details
      description: |
        补充一个具体使用场景、预期交互或实现建议。（可选）
        Add a concrete scenario, expected interaction, or implementation suggestion. (Optional)
  - type: dropdown
    id: scope
    attributes:
      label: 涉及模块 | Scope
      description: |
        该功能主要涉及哪个子系统？（可选）
        Which subsystem does this feature mainly involve? (Optional)
      options:
        - Agent runtime / Agents
        - Kernel / Causality / Storage
        - Model Gateway / AI
        - Console / Dashboard / Localhost
        - MCP Platform / Applications
        - Contracts / Configuration
        - Documentation / Landing Page
        - 其他 / Other
