name: Auto Dev Alpha Tag

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: auto-dev-alpha-tag
  cancel-in-progress: false

jobs:
  tag-dev-build:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'dev'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create next alpha tag
        run: |
          python - <<'PY'
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          with Path("pyproject.toml").open("rb") as f:
              version = tomllib.load(f)["project"]["version"]

          prefix = f"v{version}-alpha."
          head_sha = git("rev-parse", "HEAD")
          head_tags = [tag for tag in git("tag", "--points-at", head_sha).splitlines() if tag]

          if any(re.fullmatch(rf"{re.escape(prefix)}\d+", tag) for tag in head_tags):
              print(f"Alpha tag already exists for this commit: {', '.join(head_tags)}")
              raise SystemExit(0)

          pattern = re.compile(rf"{re.escape(prefix)}(\d+)$")
          versions = []
          for tag in git("tag", "-l", f"{prefix}*").splitlines():
              match = pattern.fullmatch(tag)
              if match:
                  versions.append(int(match.group(1)))

          next_num = max(versions, default=0) + 1
          next_tag = f"{prefix}{next_num}"

          subprocess.check_call(["git", "config", "user.name", "github-actions[bot]"])
          subprocess.check_call(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
          subprocess.check_call(["git", "tag", "-a", next_tag, "-m", f"Auto alpha release for dev ({head_sha})"])
          subprocess.check_call(["git", "push", "origin", next_tag])

          print(f"Created tag {next_tag} for {head_sha}")
          PY
