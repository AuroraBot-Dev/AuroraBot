name: Auto Nightly Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: auto-nightly-release
  cancel-in-progress: true

jobs:
  tag-and-release:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'nightly'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Update nightly tag and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -fa nightly -m "Auto nightly release"
          git push origin nightly --force

          gh release delete nightly --yes 2>/dev/null || true
          gh release create nightly --prerelease --generate-notes --target ${{ github.event.workflow_run.head_sha }}

          echo "Updated nightly release for ${{ github.event.workflow_run.head_sha }}"
