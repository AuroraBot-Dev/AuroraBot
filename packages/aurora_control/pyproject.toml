[project]
name = "aurora-control"
version = "0.1.0"
description = "Aurora execution contracts and control components"
requires-python = ">=3.12"
dependencies = ["aurora-core>=0.1.0"]

[project.entry-points."aurora.plugins"]
"aurora_control" = "aurora_control:plugin"

[build-system]
requires = ["hatchling", "aurora-meta-build==0.1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_control"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "plugin.meta.json", "hatch_build.py"]

[[tool.aurora-meta-build.plugins]]
manifest = "src/aurora_control/plugin.meta.toml"
module = "src/aurora_control/_meta.py"
