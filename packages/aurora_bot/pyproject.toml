[project]
name = "aurora-bot"
version = "0.1.0"
description = "AuroraBot default composition and plugins"
requires-python = ">=3.12"
dependencies = [
    "aurora-agent>=0.1.0",
    "aurora-tools>=0.1.0",
    "aurora-host>=0.1.0",
    "aurora-core>=0.1.0", "aurora-config>=0.1.0",
    "aurora-control>=0.1.0",
    "aurora-model[config,litellm]>=0.1.0",
    "aurora-world[config]>=0.1.0",
]

[project.optional-dependencies]
mcp = ["aurora-mcp[tools]>=0.1.0", "tomli-w>=1.2,<2"]
mcp-world = ["aurora-mcp[tools,world]>=0.1.0", "tomli-w>=1.2,<2"]

[project.entry-points."aurora.plugins"]
"aurora_bot.runtime" = "aurora_bot.runtime:plugin"
"aurora_bot.assembly" = "aurora_bot.assembly:plugin"
"aurora_bot.cadence" = "aurora_bot.cadence:plugin"

[build-system]
requires = ["hatchling", "aurora-meta-build==0.1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_bot"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "plugin.meta.json", "hatch_build.py"]

[[tool.aurora-meta-build.plugins]]
manifest = "src/aurora_bot/plugins/runtime/plugin.meta.toml"
module = "src/aurora_bot/plugins/runtime/_meta.py"
