schema_version = 2
plugins = [
    "aurora_config",
    "aurora_model",
    "aurora_model.configuration",
    "aurora_model.litellm",
    "aurora_agent.react",
    "aurora_agent.model",
    "aurora_agent.react_defaults",
    "aurora_agent.configuration",
    "aurora_tools",
    "aurora_tools.configuration",
    "aurora_bot.runtime",
    "aurora_bot.conversation",
    "aurora_bot.commands",
    "aurora_mcp",
    "aurora_mcp.tools",
    "aurora_world.records",
    "aurora_world.sources",
    "aurora_world.configuration",
    "aurora_mcp.world",
    "aurora_bot.world_view",
    "aurora_bot.cadence",
    "aurora_world.environment",
    "aurora_api",
    "aurora_memory",
    "aurora_memory.compaction",
    "aurora_bot.notes",
    "aurora_bot.actions",
    "aurora_bot.self_control",
]

[instances.configuration]
plugin = "aurora_config"
component = "configuration"

[instances.operations]
plugin = "aurora_bot.runtime"
component = "operations"

[instances.conversation]
plugin = "aurora_bot.conversation"
component = "endpoint"

[instances.conversation.resources.operations]
instance = "operations"
export = "operations"

[instances.main]
plugin = "aurora_agent.react"
component = "react"
depends_on = [
    "configuration",
]

[instances.main.states.inbox]
key = "org.aurora.bot:state/agents"
scope = "instance"

[instances.main.states.inbox.location]
instance_id = "main"
part = "inbox"

[instances.main.states.progress]
key = "org.aurora.bot:state/agents"
scope = "instance"

[instances.main.states.progress.location]
instance_id = "main"
part = "progress"

[instances.main.states.runtime]
key = "org.aurora.bot:state/run"
scope = "instance"

[instances.main.states.runtime.location]
instance_id = "main"

[instances.main.states.batch]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.main.states.batch.location]
instance_id = "main"
part = "batch"

[instances.main.states.decision]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.main.states.decision.location]
instance_id = "main"
part = "decision"

[instances.main.states.config]
key = "org.aurora.agent:state/react/config"
scope = "instance"

[instances.tools]
plugin = "aurora_tools"
component = "executor"
depends_on = [
    "configuration",
    "actions",
]

[instances.tools.states.input]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.tools.states.input.location]
instance_id = "main"
part = "tool_calls"

[instances.tools.states.output]
