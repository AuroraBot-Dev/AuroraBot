scope = "run"

[instances.tools.states.output.location]
instance_id = "main"
part = "tool_results"

[instances.tools.states.current]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.tools.states.current.location]
instance_id = "main"
part = "tool_current"

[instances.tools.states.config]
key = "org.aurora.tools:state/executor/config"
scope = "instance"

[instances.tools.resources.recorder]
instance = "actions"
export = "evidence"

[instances.collection]
plugin = "aurora_tools"
component = "collection"
depends_on = [
    "tools",
    "mcp_catalog",
    "chat",
    "embedding",
    "notes",
    "actions",
    "archive",
]

[instances.collection.options]
owner = "main"
instance_pattern = "{collection}/{name}"
location_field = "member"
tools = [
    { id = "org.aurora.memory:tools/write" },
    { id = "org.aurora.memory:tools/search" },
    { id = "org.aurora.memory:tools/read" },
    { id = "org.aurora.memory:tools/delete" },
    { id = "org.aurora.memory:tools/reindex" },
    { id = "org.aurora.bot:tools/notes/write" },
    { id = "org.aurora.bot:tools/notes/read" },
    { id = "org.aurora.bot:tools/notes/list" },
    { id = "org.aurora.bot:tools/actions/read" },
    { id = "org.aurora.bot:tools/self_control/status" },
    { id = "org.aurora.bot:tools/self_control/autonomy" },
    { id = "org.aurora.bot:tools/self_control/finish" },
    { id = "org.aurora.bot:tools/self_control/schedule" },
    { id = "org.aurora.bot:tools/self_control/list" },
    { id = "org.aurora.bot:tools/self_control/cancel" },
    { id = "org.aurora.bot:tools/world/read_event" },
]
include = [
    "org.aurora.mcp:tools/*",
]

