schema_version = 2
plugins = [
    "aurora_config",
    "aurora_model",
    "aurora_model.configuration",
    "aurora_model.litellm",
    "aurora_agent.react",
    "aurora_agent.model",
    "aurora_agent.react_defaults",
    "aurora_agent.configuration",
    "aurora_tools",
    "aurora_tools.configuration",
    "aurora_bot.runtime",
    "aurora_bot.conversation",
    "aurora_bot.commands",
    "aurora_mcp",
    "aurora_mcp.tools",
    "aurora_world.records",
    "aurora_world.sources",
    "aurora_world.configuration",
    "aurora_mcp.world",
    "aurora_bot.world_view",
]

[instances.configuration]
plugin = "aurora_config"
component = "configuration"

[instances.operations]
plugin = "aurora_bot.runtime"
component = "operations"

[instances.conversation]
plugin = "aurora_bot.conversation"
component = "endpoint"

[instances.conversation.resources.operations]
instance = "operations"
export = "operations"

[instances.main]
plugin = "aurora_agent.react"
component = "react"
depends_on = [
    "configuration",
]

[instances.main.states.inbox]
key = "org.aurora.bot:state/agents"
scope = "instance"

[instances.main.states.inbox.location]
instance_id = "main"
part = "inbox"

[instances.main.states.progress]
key = "org.aurora.bot:state/agents"
scope = "instance"

[instances.main.states.progress.location]
instance_id = "main"
part = "progress"

[instances.main.states.runtime]
key = "org.aurora.bot:state/run"
scope = "instance"

[instances.main.states.runtime.location]
instance_id = "main"

[instances.main.states.batch]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.main.states.batch.location]
instance_id = "main"
part = "batch"

[instances.main.states.decision]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.main.states.decision.location]
instance_id = "main"
part = "decision"

[instances.main.states.config]
key = "org.aurora.agent:state/react/config"
scope = "instance"

[instances.tools]
plugin = "aurora_tools"
component = "executor"
depends_on = [
    "configuration",
]

[instances.tools.states.input]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.tools.states.input.location]
instance_id = "main"
part = "tool_calls"

[instances.tools.states.output]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.tools.states.output.location]
instance_id = "main"
part = "tool_results"

[instances.tools.states.current]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.tools.states.current.location]
instance_id = "main"
part = "tool_current"

[instances.tools.states.config]
key = "org.aurora.tools:state/executor/config"
scope = "instance"

[instances.collection]
plugin = "aurora_tools"
component = "collection"
depends_on = [
    "tools",
    "mcp_catalog",
    "chat",
]

[instances.collection.options]
owner = "main"
instance_pattern = "{collection}/{name}"
location_field = "member"
tools = []
include = [
    "org.aurora.mcp:tools/*",
]

[instances.collection.states.input]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.collection.states.input.location]
instance_id = "main"
part = "tool_input"

[instances.collection.states.output]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.collection.states.output.location]
instance_id = "main"
part = "tool_output"

[instances.collection.resources.catalog]
instance = "mcp_catalog"
export = "catalog"

[instances.collection.resources.tools.clients]
instance = "mcp_clients"
export = "clients"

[instances.chat]
plugin = "aurora_model"
component = "chat"
depends_on = [
    "configuration",
    "mcp_catalog",
]

[instances.chat.options]
profile = "primary"

[instances.chat.states.profiles]
key = "org.aurora.model:state/config"
scope = "instance"

[instances.chat.resources.catalog]
instance = "collection"
export = "catalog"

[instances.model_call]
plugin = "aurora_agent.model"
component = "model_call"
depends_on = [
    "chat",
]

[instances.model_call.states.input]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.model_call.states.input.location]
instance_id = "main"
part = "model_input"

[instances.model_call.states.output]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.model_call.states.output.location]
instance_id = "main"
part = "model_output"

[instances.model_call.states.config]
key = "org.aurora.agent:state/model_call/config"
scope = "instance"

[instances.model_call.resources.chat]
instance = "chat"
export = "model"

[instances.defaults]
plugin = "aurora_agent.react_defaults"
component = "defaults"
depends_on = [
    "main",
    "tools",
]

[instances.defaults.states.context]
key = "org.aurora.bot:state/messages"
scope = "instance"

[instances.defaults.states.context.location]
instance_id = "main"

[instances.defaults.states.batch]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.defaults.states.batch.location]
instance_id = "main"
part = "batch"

[instances.defaults.states.decision]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.defaults.states.decision.location]
instance_id = "main"
part = "decision"

[instances.defaults.states.model_input]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.defaults.states.model_input.location]
instance_id = "main"
part = "model_input"

[instances.defaults.states.model_output]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.defaults.states.model_output.location]
instance_id = "main"
part = "model_output"

[instances.defaults.states.tool_input]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.defaults.states.tool_input.location]
instance_id = "main"
part = "tool_calls"

[instances.defaults.states.tool_output]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.defaults.states.tool_output.location]
instance_id = "main"
part = "tool_results"

[instances.defaults.states.config]
key = "org.aurora.agent:state/react_defaults/config"
scope = "instance"

[instances.defaults.resources.agent]
instance = "main"
export = "agent"

[instances.defaults.resources.tools]
instance = "tools"
export = "executor"

[instances.defaults.resources.context_view]
instance = "view"
export = "view"

[instances.runtime]
plugin = "aurora_bot.runtime"
component = "runtime"
depends_on = [
    "defaults",
    "model_call",
    "collection",
]

[instances.runtime.options]
owner = "main"

[instances.runtime.states.context]
key = "org.aurora.bot:state/messages"
scope = "instance"

[instances.runtime.states.context.location]
instance_id = "main"

[instances.runtime.states.model_output]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.runtime.states.model_output.location]
instance_id = "main"
part = "model_output"

[instances.runtime.states.tool_output]
key = "org.aurora.bot:state/react_work"
scope = "run"

[instances.runtime.states.tool_output.location]
instance_id = "main"
part = "tool_results"

[instances.runtime.states.work]
key = "org.aurora.bot:state/react_work"
scope = "instance"

[instances.runtime.states.work.location]
instance_id = "main"

[instances.runtime.resources.agent]
instance = "main"
export = "agent"

[instances.runtime.resources.operations]
instance = "operations"
export = "operations"

[instances.mcp_clients]
plugin = "aurora_mcp"
component = "clients"
depends_on = [
    "configuration",
]

[instances.mcp_catalog]
plugin = "aurora_mcp.tools"
component = "catalog"
depends_on = [
    "mcp_clients",
]

[instances.mcp_catalog.resources.clients]
instance = "mcp_clients"
export = "clients"

[instances.records]
plugin = "aurora_world.records"
component = "records"
depends_on = [
    "configuration",
]

[instances.source_resources]
plugin = "aurora_mcp.world"
component = "source_resources"

[instances.source_resources.resources.clients]
instance = "mcp_clients"
export = "clients"

[instances.sources]
plugin = "aurora_world.sources"
component = "sources"
depends_on = [
    "records",
    "runtime",
    "mcp_clients",
]

[instances.sources.resources.records]
instance = "records"
export = "records"

[instances.world_configuration]
plugin = "aurora_world.configuration"
component = "configuration"
depends_on = [
    "configuration",
]

[instances.world_configuration.resources.sources]
instance = "sources"
export = "sources"

[instances.world_configuration.resources.source_resources."org.aurora.mcp:sources/resources"]
instance = "source_resources"
export = "resources"

[instances.view]
plugin = "aurora_bot.world_view"
component = "view"
depends_on = [
    "records",
]

[instances.view.states.config]
key = "org.aurora.bot:state/world_view/config"
scope = "instance"

[instances.view.resources.records]
instance = "records"
export = "records"

