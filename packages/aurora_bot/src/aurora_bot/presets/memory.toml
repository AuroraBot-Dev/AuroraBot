[connections.plug]
instance = "configuration"
id = "org.aurora.config:handlers/load"

[connections.slot]
instance = "configuration"
id = "org.aurora.core:lifecycle/config"

[[connections]]
priority = 0

[connections.plug]
instance = "main"
id = "org.aurora.agent:handlers/react/configure"

[connections.slot]
instance = "main"
id = "org.aurora.core:lifecycle/config"

[[connections]]
