[project]
name = "aurora-api"
version = "0.1.0"
description = "AuroraBot HTTP and WebSocket transport"
requires-python = ">=3.12"
dependencies = ["aurora-core>=0.1.0", "aiohttp>=3.14.5,<4"]

[project.entry-points."aurora.plugins"]
"aurora_api" = "aurora_api.endpoints:plugin"

[build-system]
requires = ["hatchling", "aurora-meta-build==0.1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_api"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "plugin.meta.json", "hatch_build.py"]

[[tool.aurora-meta-build.plugins]]
manifest = "src/aurora_api/plugin.meta.toml"
module = "src/aurora_api/_meta.py"
