[project]
name = "aurora-model"
version = "0.1.0"
description = "Aurora model protocols, configuration and providers"
requires-python = ">=3.12"
dependencies = ["aurora-core>=0.1.0", "aurora-tools>=0.1.0"]

[project.optional-dependencies]
config = ["aurora-config>=0.1.0"]
litellm = ["litellm>=1.106.6,<1.107"]

[project.entry-points."aurora.plugins"]
"aurora_model" = "aurora_model.plugin:plugin"
"aurora_model.configuration" = "aurora_model.configuration:plugin"
"aurora_model.litellm" = "aurora_model.supplier:plugin"

[build-system]
requires = ["hatchling", "aurora-meta-build==0.1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_model"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "plugin.meta.json", "hatch_build.py"]

[[tool.aurora-meta-build.plugins]]
manifest = "src/aurora_model/plugins/model/plugin.meta.toml"
module = "src/aurora_model/plugins/model/_meta.py"

[[tool.aurora-meta-build.plugins]]
manifest = "src/aurora_model/plugins/configuration/plugin.meta.toml"
module = "src/aurora_model/plugins/configuration/_meta.py"

[[tool.aurora-meta-build.plugins]]
manifest = "src/aurora_model/plugins/litellm/plugin.meta.toml"
module = "src/aurora_model/plugins/litellm/_meta.py"
