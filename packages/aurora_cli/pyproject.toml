[project]
name = "aurora-cli"
version = "0.1.0"
description = "AuroraBot command-line interface"
requires-python = ">=3.12"
dependencies = [
    "aurora-host>=0.1.0",
    "aurora-core>=0.1.0",
    "aurora-config>=0.1.0",
    "aurora-api>=0.1.0",
    "aurora-logging>=0.1.0",
    "rich>=14,<15",
    "tomlkit>=0.13,<1",
]

[project.scripts]
aurora = "aurora_cli.main:main"

[build-system]
requires = ["hatchling", "aurora-meta-build==0.1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_cli"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "plugin.meta.json", "hatch_build.py"]

[[tool.aurora-meta-build.hosts]]
manifest = "src/aurora_cli/plugin.meta.toml"
module = "src/aurora_cli/_meta.py"
