[project]
name = "aurora-world"
version = "0.1.0"
description = "AuroraBot world inputs and shared environment state"
requires-python = ">=3.12"
dependencies = ["aurora-core>=0.1.0"]

[project.optional-dependencies]
config = ["aurora-config>=0.1.0"]
environment = ["aurora-config>=0.1.0", "httpx>=0.28,<1"]

[project.entry-points."aurora.plugins"]
"aurora_world.records" = "aurora_world.records:plugin"
"aurora_world.sources" = "aurora_world.sources:plugin"
"aurora_world.configuration" = "aurora_world.configuration:plugin"
"aurora_world.environment" = "aurora_world.environment:plugin"

[build-system]
requires = ["hatchling", "aurora-meta-build==0.1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_world"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "plugin.meta.json", "hatch_build.py"]


[[tool.aurora-meta-build.plugins]]
manifest = "src/aurora_world/plugins/records/plugin.meta.toml"
module = "src/aurora_world/plugins/records/_meta.py"

[[tool.aurora-meta-build.plugins]]
manifest = "src/aurora_world/plugins/sources/plugin.meta.toml"
module = "src/aurora_world/plugins/sources/_meta.py"

[[tool.aurora-meta-build.plugins]]
manifest = "src/aurora_world/plugins/configuration/plugin.meta.toml"
module = "src/aurora_world/plugins/configuration/_meta.py"

[[tool.aurora-meta-build.plugins]]
manifest = "src/aurora_world/plugins/environment/plugin.meta.toml"
module = "src/aurora_world/plugins/environment/_meta.py"
