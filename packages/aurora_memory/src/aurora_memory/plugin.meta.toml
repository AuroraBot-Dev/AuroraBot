schema_version = 2

[plugins.memory]
entry_point = "aurora_memory"
title = "长期记忆"
summary = "owner 隔离的存储与五种工具；借用显式 embedding 资源"
requires = [
    "aurora_config",
    "aurora_tools",
]

[definitions.CONFIGURATION]
plugin = "memory"
id = "org.aurora.memory:configs/default"
kind = "config"
summary = "记忆索引和分块配置声明"
contract = "configuration"

[definitions.CONFIGURATION.register_to]
id = "org.aurora.config:registries/configs"

[definitions.CONFIG]
plugin = "memory"
id = "org.aurora.memory:state/config"
kind = "state_key"
summary = "非持久的索引与分块参数"

[definitions.COMPONENT]
plugin = "memory"
id = "org.aurora.memory:components/tool"
kind = "component"
summary = "通过显式输入输出地址执行单一记忆动作"

[definitions.STORE]
plugin = "memory"
id = "org.aurora.memory:components/store"
kind = "component"
summary = "按 owner 隔离的 SQLite 存储资源"

[definitions.PREPARE]
plugin = "memory"
id = "org.aurora.memory:handlers/store/prepare"
kind = "hook_handler"
summary = "创建 SQLite 连接并绑定借用的 embedding"

[definitions.PREPARE.register_to]
id = "org.aurora.core:registries/hook_handlers"

[definitions.CLEAN]
plugin = "memory"
id = "org.aurora.memory:handlers/store/clean"
kind = "hook_handler"
summary = "关闭本实例的数据库连接，保留借用的模型资源"

[definitions.CLEAN.register_to]
id = "org.aurora.core:registries/hook_handlers"

[definitions.EXECUTE]
plugin = "memory"
id = "org.aurora.memory:components/tool/execute"
kind = "hook_handler"
summary = "读取工具调用并将记忆操作结果写入输出状态"

[definitions.EXECUTE.register_to]
id = "org.aurora.core:registries/hook_handlers"

[definitions.EXECUTE.interface.definition]
local = "COMPONENT"

[definitions.WRITE]
plugin = "memory"
id = "org.aurora.memory:tools/write"
kind = "tool"
summary = "保存或更新长期文本记忆"
contract = "tools"

[definitions.WRITE.register_to]
id = "org.aurora.tools:registries/tools"

[definitions.SEARCH]
plugin = "memory"
id = "org.aurora.memory:tools/search"
kind = "tool"
summary = "按语义检索当前 owner 的记忆"
contract = "tools"

[definitions.SEARCH.register_to]
id = "org.aurora.tools:registries/tools"

[definitions.READ]
plugin = "memory"
id = "org.aurora.memory:tools/read"
kind = "tool"
summary = "读取记忆全文及版本"
contract = "tools"

[definitions.READ.register_to]
id = "org.aurora.tools:registries/tools"

[definitions.DELETE]
plugin = "memory"
id = "org.aurora.memory:tools/delete"
kind = "tool"
summary = "按预期版本删除记忆"
contract = "tools"

[definitions.DELETE.register_to]
id = "org.aurora.tools:registries/tools"

[definitions.REINDEX]
plugin = "memory"
id = "org.aurora.memory:tools/reindex"
kind = "tool"
summary = "使用绑定的 embedding 重建当前 owner 的索引"
contract = "tools"

[definitions.REINDEX.register_to]
id = "org.aurora.tools:registries/tools"

[components.store]
plugin = "memory"
summary = "持有当前 owner 的数据库连接，向压缩桥导出记忆资源"
inject = [
    "ctx",
    "storage",
    "instance_id",
    "states",
    "options",
]
plugs = [
    "PREPARE",
    "CLEAN",
]
slots = []
states = [
    "config",
]
inputs = [
    "embedding",
]
resources = [
    "memory",
]
options = "store"

[components.tool]
plugin = "memory"
summary = "执行所选记忆动作，借用 embedding 并持有自己的数据库连接"
inject = [
    "ctx",
    "storage",
    "instance_id",
    "states",
    "options",
]
plugs = [
    "PREPARE",
    "CLEAN",
    "EXECUTE",
]
slots = []
states = [
    "config",
    "input",
    "output",
]
inputs = [
    "embedding",
]
resources = []
options = "tool"

[contracts.configuration]
format = "json-schema"
file = "config.schema.json"

[contracts.tools]
format = "aurora-tools"
export = "aurora_memory.contracts:describe_tools"

[contracts.store]
format = "json-schema"
file = "store.schema.json"

[contracts.tool]
format = "json-schema"
file = "tool.schema.json"
