[project]
name = "aurora-memory"
version = "0.1.0"
description = "Aurora owner-scoped text memory and tools"
requires-python = ">=3.12"
dependencies = ["aurora-core>=0.1.0", "aurora-config>=0.1.0", "aurora-control>=0.1.0", "aurora-model>=0.1.0", "aurora-tools>=0.1.0"]

[project.optional-dependencies]
compaction = ["aurora-agent>=0.1.0"]

[project.entry-points."aurora.plugins"]
aurora_memory = "aurora_memory:plugin"
"aurora_memory.compaction" = "aurora_memory.compaction:plugin"

[build-system]
requires = ["hatchling", "aurora-meta-build==0.1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_memory"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "plugin.meta.json", "hatch_build.py"]

[[tool.aurora-meta-build.plugins]]
manifest = "src/aurora_memory/plugin.meta.toml"
module = "src/aurora_memory/_meta.py"

[[tool.aurora-meta-build.plugins]]
manifest = "src/aurora_memory/compaction/plugin.meta.toml"
module = "src/aurora_memory/compaction/_meta.py"
