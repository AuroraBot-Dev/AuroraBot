[project]
name = "aurora-core"
version = "0.1.0"
description = "AuroraBot microkernel"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling", "aurora-meta-build==0.1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_core"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "plugin.meta.json", "hatch_build.py"]

[[tool.aurora-meta-build.hosts]]
manifest = "src/aurora_core/plugin.meta.toml"
module = "src/aurora_core/_meta.py"
