schema_version = 2

[plugins.model]
entry_point = "aurora_agent.model"
title = "模型调用"
summary = "读取请求状态，调用绑定的模型资源并更新输出状态"
requires = []

[definitions.MODEL_CALL]
plugin = "model"
id = "org.aurora.agent:handlers/model_call"
kind = "component"
summary = "模型调用组件"

[definitions.EXECUTE]
plugin = "model"
id = "org.aurora.agent:handlers/model_call/execute"
kind = "hook_handler"
summary = "模型执行插头"

[definitions.EXECUTE.register_to]
id = "org.aurora.core:registries/hook_handlers"

[definitions.EXECUTE.interface.definition]
local = "MODEL_CALL"

[definitions.CONFIGURE]
plugin = "model"
id = "org.aurora.agent:handlers/model_call/configure"
kind = "hook_handler"
summary = "读取显式绑定的模型调用参数"

[definitions.CONFIGURE.register_to]
id = "org.aurora.core:registries/hook_handlers"

[components.model_call]
plugin = "model"
summary = "模型客户端由资源绑定提供，组件不关闭借用的客户端"
inject = [
    "ctx",
    "instance_id",
    "states",
    "options",
]
plugs = [
    "EXECUTE",
    "CONFIGURE",
]
slots = []
states = [
    "input",
    "output",
]
inputs = [
    "chat",
]
options = "model_options"
resources = [
    "model_call",
]
optional_states = [
    "config",
]

[contracts.model_options]
format = "json-schema"
export = "aurora_agent.parameters:model_call_options"
