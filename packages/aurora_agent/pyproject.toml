[project]
name = "aurora-agent"
version = "0.1.0"
description = "Aurora agent execution, model calls and default phases"
requires-python = ">=3.12"
dependencies = [
    "aurora-core>=0.1.0",
    "aurora-control>=0.1.0",
    "aurora-model>=0.1.0",
    "aurora-tools>=0.1.0",
]

[project.entry-points."aurora.plugins"]
"aurora_agent.model" = "aurora_agent.plugins.model:plugin"
"aurora_agent.react" = "aurora_agent.react:plugin"
"aurora_agent.react_defaults" = "aurora_agent.react_defaults:plugin"

[build-system]
requires = ["hatchling", "aurora-meta-build==0.1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_agent"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "plugin.meta.json", "hatch_build.py"]

[[tool.aurora-meta-build.plugins]]
manifest = "src/aurora_agent/plugins/model/plugin.meta.toml"
module = "src/aurora_agent/plugins/model/_meta.py"
