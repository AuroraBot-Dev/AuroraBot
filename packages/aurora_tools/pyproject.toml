[project]
name = "aurora-tools"
version = "0.1.0"
description = "Aurora tool contracts, definitions and execution"
requires-python = ">=3.12"
dependencies = [
    "aurora-core>=0.1.0",
    "aurora-control>=0.1.0",
    "jsonschema>=4.26.0",
    "referencing>=0.37.0",
]

[project.optional-dependencies]
config = ["aurora-config>=0.1.0"]

[project.entry-points."aurora.plugins"]
"aurora_tools.configuration" = "aurora_tools.plugins.configuration:plugin"
aurora_tools = "aurora_tools.execution:plugin"

[build-system]
requires = ["hatchling", "aurora-meta-build==0.1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_tools"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "plugin.meta.json", "hatch_build.py"]

[[tool.aurora-meta-build.plugins]]
manifest = "src/aurora_tools/plugins/tools/plugin.meta.toml"
module = "src/aurora_tools/plugins/tools/_meta.py"

[[tool.aurora-meta-build.plugins]]
manifest = "src/aurora_tools/plugins/configuration/plugin.meta.toml"
module = "src/aurora_tools/plugins/configuration/_meta.py"
