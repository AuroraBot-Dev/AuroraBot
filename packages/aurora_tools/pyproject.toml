[project]
name = "aurora-tools"
version = "0.1.0"
description = "Aurora tool contracts, definitions and execution"
requires-python = ">=3.12"
dependencies = [
    "aurora-core>=0.1.0",
    "aurora-control>=0.1.0",
    "jsonschema>=4.26.0",
    "referencing>=0.37.0",
]

[project.entry-points."aurora.plugins"]
aurora_tools = "aurora_tools.execution:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_tools"]
