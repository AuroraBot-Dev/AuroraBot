[project]
name = "aurora-mcp"
version = "0.1.0"
description = "Aurora MCP clients and optional tool/world bridges"
requires-python = ">=3.12"
dependencies = ["aurora-core>=0.1.0", "aurora-config>=0.1.0", "mcp==2.3.0", "httpx2>=2.16,<3", "anyio>=4.15,<5"]

[project.optional-dependencies]
tools = ["aurora-tools>=0.1.0"]
world = ["aurora-world[config]>=0.1.0"]

[project.entry-points."aurora.plugins"]
"aurora_mcp" = "aurora_mcp:plugin"
"aurora_mcp.world" = "aurora_mcp.world:plugin"
"aurora_mcp.tools" = "aurora_mcp.tools:plugin"

[build-system]
requires = ["hatchling", "aurora-meta-build==0.1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_mcp"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "plugin.meta.json", "hatch_build.py"]

[[tool.aurora-meta-build.plugins]]
manifest = "src/aurora_mcp/plugins/clients/plugin.meta.toml"
module = "src/aurora_mcp/plugins/clients/_meta.py"

[[tool.aurora-meta-build.plugins]]
manifest = "src/aurora_mcp/plugins/tools/plugin.meta.toml"
module = "src/aurora_mcp/plugins/tools/_meta.py"

[[tool.aurora-meta-build.plugins]]
manifest = "src/aurora_mcp/plugins/world/plugin.meta.toml"
module = "src/aurora_mcp/plugins/world/_meta.py"
