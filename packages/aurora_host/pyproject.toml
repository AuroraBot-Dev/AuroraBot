[project]
name = "aurora-host"
version = "0.1.0"
description = "Aurora application assembly and runtime host"
requires-python = ">=3.12"
dependencies = ["aurora-core>=0.1.0", "aurora-config>=0.1.0", "aurora-control>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_host"]
