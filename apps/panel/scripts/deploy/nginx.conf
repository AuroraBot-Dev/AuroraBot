
# AuroraBot Panel 反向代理：托管静态 SPA 并把 /api 转发到本机后端。
# 后端强制监听 loopback（config/runtime.toml 的 runtime.panel.host = "127.0.0.1"），
# 因此本 nginx 必须与 aurora 进程在同一主机上运行（或使用 --network host 的容器）。
#
# 注意：请求 Origin 会原样透传给后端，请把本部署的访问来源加入后端的
# runtime.panel.allowed_origins（例如 http://127.0.0.1:8080），否则 CORS 会拒绝请求。

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_min_length 1k;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;

    # 面板后端：认证与操作树
    location /api/ {
      proxy_pass http://127.0.0.1:8765;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
    }

    # 健康检查（无认证）
    location /healthz {
      proxy_pass http://127.0.0.1:8765/healthz;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 静态资源
    location / {
      try_files $uri $uri/ /index.html;
      index index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
}
