    <script>
      (function () {
        var DEFAULT_LOCALE = "zh-CN";
        var LOCALE_CODES = { "zh-CN": "中", "en-US": "EN", "ja-JP": "日" };
        var LOCALE_ALIASES = {
          zh: "zh-CN",
          "zh-cn": "zh-CN",
          "zh-hans": "zh-CN",
          en: "en-US",
          "en-us": "en-US",
          ja: "ja-JP",
          "ja-jp": "ja-JP",
        };
        var root = document.documentElement;
        var themeButton = document.querySelector(".theme-toggle");
        var languagePicker = document.querySelector(".language-picker");
        var languageButton = document.querySelector(".language-toggle");
        var languageMenu = document.querySelector(".language-menu");
        var languageCode = document.querySelector("[data-language-code]");
        var languageOptions = Array.from(document.querySelectorAll("[data-locale]"));
        var storedTheme = localStorage.getItem("aurora-theme");
        var activeMessages = null;

        function messageAt(messages, path) {
          return path.split(".").reduce(function (value, segment) {
            return value && value[segment];
          }, messages);
        }

        function applyMessages(messages) {
          activeMessages = messages;
          root.lang = messages.meta.locale;
          root.dir = messages.meta.direction;
          languageCode.textContent = LOCALE_CODES[messages.meta.locale] || messages.meta.locale;
          languageOptions.forEach(function (option) {
            option.setAttribute("aria-checked", String(option.getAttribute("data-locale") === messages.meta.locale));
          });

          document.querySelectorAll("[data-i18n]").forEach(function (element) {
            element.textContent = messageAt(messages, element.getAttribute("data-i18n"));
          });

          document.querySelectorAll("[data-i18n-attr]").forEach(function (element) {
            element
              .getAttribute("data-i18n-attr")
              .split(",")
              .forEach(function (binding) {
                var separator = binding.indexOf(":");
                var attribute = binding.slice(0, separator);
                var key = binding.slice(separator + 1);
                element.setAttribute(attribute, messageAt(messages, key));
              });
          });

          document.getElementById("structured-data").textContent = JSON.stringify(messages.meta.schema);
          root.removeAttribute("data-i18n-loading");
          window.dispatchEvent(new CustomEvent("aurora:locale-changed", { detail: { locale: messages.meta.locale } }));
        }

        function normalizeLocale(locale) {
          var normalized = String(locale || DEFAULT_LOCALE)
            .replace(/_/g, "-")
            .replace(/[^A-Za-z0-9-]/g, "")
            .toLowerCase();
          return LOCALE_ALIASES[normalized] || LOCALE_ALIASES[normalized.split("-")[0]] || DEFAULT_LOCALE;
        }

        function loadLocale(locale) {
          var normalized = normalizeLocale(locale);
          return fetch("assets/i18n/" + normalized + ".json")
            .then(function (response) {
              if (!response.ok) throw new Error(String(response.status));
              return response.json();
            })
            .then(function (messages) {
              applyMessages(messages);
              return messages;
            });
        }

        window.AuroraI18n = {
          load: function (locale) {
            var normalized = normalizeLocale(locale);
            localStorage.setItem("aurora-locale", normalized);
            return loadLocale(normalized);
          },
        };

        function closeLanguageMenu(returnFocus) {
          languageMenu.hidden = true;
          languageButton.setAttribute("aria-expanded", "false");
          if (returnFocus) languageButton.focus();
        }

        function openLanguageMenu() {
          languageMenu.hidden = false;
          languageButton.setAttribute("aria-expanded", "true");
          var activeOption = languageOptions.find(function (option) {
            return option.getAttribute("aria-checked") === "true";
          });
          (activeOption || languageOptions[0]).focus();
        }

        languageButton.addEventListener("click", function () {
          if (languageMenu.hidden) openLanguageMenu();
          else closeLanguageMenu(false);
        });

        languageButton.addEventListener("keydown", function (event) {
          if (event.key !== "ArrowDown") return;
          event.preventDefault();
          openLanguageMenu();
        });

        languageMenu.addEventListener("keydown", function (event) {
          var currentIndex = languageOptions.indexOf(document.activeElement);
          if (event.key === "Escape") {
            event.preventDefault();
            closeLanguageMenu(true);
          } else if (event.key === "ArrowDown" || event.key === "ArrowUp") {
            event.preventDefault();
            var offset = event.key === "ArrowDown" ? 1 : -1;
            languageOptions[(currentIndex + offset + languageOptions.length) % languageOptions.length].focus();
          }
        });

        languageOptions.forEach(function (option) {
          option.addEventListener("click", function () {
            var locale = option.getAttribute("data-locale");
            window.AuroraI18n.load(locale).then(function () {
              var url = new URL(window.location.href);
              url.searchParams.set("lang", locale);
              window.history.replaceState(null, "", url);
              closeLanguageMenu(true);
            });
          });
        });

        document.addEventListener("click", function (event) {
          if (!languageMenu.hidden && !languagePicker.contains(event.target)) closeLanguageMenu(false);
        });

        if (storedTheme === "dark" || storedTheme === "light") {
          root.setAttribute("data-theme", storedTheme);
        } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          root.setAttribute("data-theme", "dark");
        }

        themeButton.addEventListener("click", function () {
          var nextTheme = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", nextTheme);
          localStorage.setItem("aurora-theme", nextTheme);
        });

        document.querySelectorAll("[data-copy-target]").forEach(function (button) {
          button.addEventListener("click", function () {
            var target = document.getElementById(button.getAttribute("data-copy-target"));
            if (!target || !navigator.clipboard || !activeMessages) return;
            navigator.clipboard.writeText(target.innerText).then(function () {
              button.textContent = messageAt(activeMessages, "start.copied");
              window.setTimeout(function () {
                button.textContent = messageAt(activeMessages, "start.copy");
              }, 1600);
            });
          });
        });

        var requestedLocale =
          new URLSearchParams(window.location.search).get("lang") ||
          localStorage.getItem("aurora-locale") ||
          navigator.language ||
          DEFAULT_LOCALE;
        loadLocale(requestedLocale).catch(function () {
          if (requestedLocale !== DEFAULT_LOCALE) return loadLocale(DEFAULT_LOCALE);
          root.removeAttribute("data-i18n-loading");
        });
      })();
    </script>
