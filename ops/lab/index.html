<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f0e8" />
    <title>AuroraBot Lab</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="lab.css" />
  </head>
  <body>
    <header>
      <span class="brand"><img src="logo.svg" alt="" />AuroraBot Lab</span>
      <div class="header-actions">
        <input
          id="bootstrap-token"
          type="password"
          placeholder="bootstrap token (data/ops/Token.txt)"
          spellcheck="false"
        />
        <button id="auth-btn" class="primary">登录</button>
        <button class="icon-button theme-toggle" type="button" aria-label="切换主题">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.7 8.7 0 1 0 20.5 14.2Z" />
          </svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <aside>
        <h2>快捷端点</h2>
        <div id="quick-list"></div>
      </aside>

      <section>
        <div class="card" id="request-card">
          <h2>请求</h2>
          <div class="row">
            <select id="method">
              <option value="GET">GET</option>
              <option value="POST">POST</option>
            </select>
            <input
              id="path"
              type="text"
              value="engine/status"
              spellcheck="false"
              placeholder="路径，如 engine/status（相对 /api/ops/）"
            />
            <button id="run-btn" class="primary">执行</button>
          </div>
          <label for="params">查询参数（GET，原样拼接在 ? 后面）</label>
          <input id="params" type="text" placeholder="status=completed&amp;limit=10" spellcheck="false" />
          <label for="body">请求体（POST，JSON）</label>
          <textarea id="body" placeholder='{"text": "你好"}'></textarea>
        </div>
        <div class="card" id="response-wrap">
          <h2>响应</h2>
          <div id="response-head">尚未发起请求</div>
          <pre id="response"></pre>
        </div>
      </section>
    </main>

    <script src="lab.js"></script>
  </body>
</html>
